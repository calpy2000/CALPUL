<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Inline page-load spinner CSS — see the matching comment in the hub's
     own index.html for why this is duplicated inline on every page rather
     than centralized in tokens.css. -->
<style>
  .page-loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#eef0f3;opacity:0;pointer-events:none;animation:page-loading-reveal 0s 200ms forwards}
  @keyframes page-loading-reveal{to{opacity:1;pointer-events:auto}}
  .page-loading__spinner{width:68px;height:68px;border-radius:50%;border:6px solid #c7cdd6;border-top-color:#3d5af1;animation:page-loading-spin .8s linear infinite}
  @keyframes page-loading-spin{to{transform:rotate(360deg)}}
  .page-loading__message{margin:0;padding:0 24px;font:15px/1.4 system-ui,sans-serif;color:#5a6472;text-align:center}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Standalone home-screen launch (no Safari chrome) — see the matching
     comment in the hub's own index.html. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Android/Samsung Internet/Chrome equivalent — see the matching comment
     in the hub's own index.html. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d5af1">
<title>GLYMPZ</title>
<!-- Same apple-touch-icon as every page — see the matching comment in the
     hub's own index.html. -->
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<!-- Same load order as every other game: tokens.css (variables + reset)
     first, then shell.css (shared header/footer/timer/overlay chrome), then
     this game's own style.css last so it can add/override freely. -->
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="stylesheet" href="../../shared/tools-panel.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Page-load spinner — see shared/tokens.css's .page-loading rules and
       shared/core/loading-indicator.js. Same convention on every page. -->
  <div class="page-loading" id="pageLoading" aria-hidden="true"><div class="page-loading__spinner"></div></div>

  <!-- Same .shell > .shell-stage#game-stage > #game-root convention as
       every game (see the longer explanation in games/solvz/index.html) —
       shell.js finds #game-stage/#game-root by id and wraps them with the
       shared chrome. #grid-container starts empty; index.js's
       createTiles() fills it with 36 individual tile <div>s once the page
       loads. -->
  <div class="shell" id="app-shell">
    <div class="shell-stage" id="game-stage">
      <div id="game-root">
        <div id="grid-container"></div>
      </div>
    </div>
  </div>

  <!-- defer (not a plain blocking script tag): without it, the browser
       pauses HTML parsing — and, more importantly, the FIRST PAINT of the
       whole page, spinner included — to fetch this from a cross-origin CDN
       before it can render anything, which on a slow/cellular connection is
       exactly what leaves the page looking blank instead of showing the
       page-load spinner. defer fetches it in the background and still runs
       it (in document order, before index.js) once parsing finishes — same
       effective timing, just non-render-blocking. See loading-indicator.js. -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
  <!-- Powers the confetti celebration on a win (see shared/core/shell.js's
       fireConfetti()) — a small (~5KB) standalone library, no dependency on
       jQuery or anything else. defer for the same reason as jQuery above. -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script type="module" src="index.js"></script>
</body>
</html>

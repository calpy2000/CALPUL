<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SLYDZ</title>
<!-- Same load order convention as every other game — see the matching
     comment in games/solvz/index.html. -->
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="stylesheet" href="../../shared/tools-panel.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Same .shell > .shell-stage#game-stage > #game-root convention as
       every other game. #grid starts empty — index.js's buildGrid() fills
       it with 25 single-letter tile <div>s once the page loads.

       One thing you won't see written here at all: the "💡 Help" button
       in the header. It doesn't exist in this HTML — index.js builds it
       with JavaScript and inserts it into the shared header AFTER that
       header itself gets created (see shell.js's initShell()). That's a
       SLYDZ-only feature, so it lives entirely in SLYDZ's own files rather
       than being added to the shared header markup every game gets. -->
  <div class="shell" id="app-shell">
    <div class="shell-stage" id="game-stage">
      <div id="game-root">
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Powers the confetti celebration on a win (see shared/core/shell.js's
       fireConfetti()) — a small (~5KB) standalone library, no dependency on
       jQuery or anything else. -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>

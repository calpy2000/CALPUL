<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Inline page-load spinner CSS — see the matching comment in the hub's
     own index.html for why this is duplicated inline on every page rather
     than centralized in tokens.css. -->
<style>
  .page-loading{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#eef0f3;opacity:0;pointer-events:none;animation:page-loading-reveal 0s 200ms forwards}
  @keyframes page-loading-reveal{to{opacity:1;pointer-events:auto}}
  .page-loading__spinner{width:68px;height:68px;border-radius:50%;border:6px solid #c7cdd6;border-top-color:#3d5af1;animation:page-loading-spin .8s linear infinite}
  @keyframes page-loading-spin{to{transform:rotate(360deg)}}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Standalone home-screen launch (no Safari chrome) — see the matching
     comment in the hub's own index.html. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Android/Samsung Internet/Chrome equivalent — see the matching comment
     in the hub's own index.html. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d5af1">
<title>TOTALZ</title>
<!-- Same apple-touch-icon as every page — see the matching comment in the
     hub's own index.html. -->
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<!-- Load order matters: tokens.css defines the CSS variables (--ink,
     --accent, etc.) that shell.css and this game's own style.css both use
     via var(--name), so it has to come first. shell.css provides the
     header/footer/timer/overlay chrome shared by every game (see
     shared/shell.css) — style.css (last, so it can override anything
     above it) then adds TOTALZ's own board/tile styling. -->
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="stylesheet" href="../../shared/tools-panel.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Page-load spinner — see shared/tokens.css's .page-loading rules and
       shared/core/loading-indicator.js. Same convention on every page. -->
  <div class="page-loading" id="pageLoading" aria-hidden="true"><div class="page-loading__spinner"></div></div>

  <!-- This nested structure — .shell > .shell-stage#game-stage >
       #game-root > (game content) — is the fixed convention every game
       follows. shared/core/shell.js's initShell() looks for #game-stage
       and #game-root specifically by those ids and injects the
       header/footer/overlay/end-screen around them; everything actually
       INSIDE #game-root (the target card, ledger, prompt and keypad below)
       is TOTALZ-specific and built dynamically by index.js. -->
  <div class="shell" id="app-shell">
    <div class="shell-stage" id="game-stage">
      <div id="game-root">
        <div class="totalz-board" id="board">
          <div class="totalz-target">
            <div>
              <div class="totalz-target__label">Target</div>
              <div class="totalz-target__value" id="totalz-target-value">000</div>
              <div class="totalz-target__min-required" id="totalz-min-required"></div>
            </div>
            <div class="totalz-target__delta" id="totalz-delta"></div>
          </div>

          <div class="totalz-ledger" id="totalz-ledger"></div>

          <div class="totalz-prompt" id="totalz-prompt"></div>

          <div class="totalz-keypad">
            <div class="totalz-row totalz-row--numbers" id="totalz-number-row"></div>
            <div class="totalz-row totalz-row--operators" id="totalz-operator-row"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery, loaded from a public CDN — index.js uses jQuery's `$` for
       tile/button building and event wiring, same convention as
       SOLVZ/GLYMPZ/QUADZ. defer so it doesn't block first paint/the
       page-load spinner — see the matching comment in games/solvz/index.html. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <!-- Powers the confetti celebration on a win (see shared/core/shell.js's
       fireConfetti()). defer for the same reason as jQuery above. -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script type="module" src="index.js"></script>
</body>
</html>

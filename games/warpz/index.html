<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Inline page-load spinner CSS — see the matching comment in the hub's
       own index.html for why this is duplicated inline on every page
       rather than centralized in tokens.css. -->
  <style>
    .page-loading{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#eef0f3;opacity:0;pointer-events:none;animation:page-loading-reveal 0s 200ms forwards}
    @keyframes page-loading-reveal{to{opacity:1;pointer-events:auto}}
    .page-loading__spinner{width:68px;height:68px;border-radius:50%;border:6px solid #c7cdd6;border-top-color:#3d5af1;animation:page-loading-spin .8s linear infinite}
    @keyframes page-loading-spin{to{transform:rotate(360deg)}}
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Standalone home-screen launch (no Safari chrome) — see the matching
       comment in the hub's own index.html. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Android/Samsung Internet/Chrome equivalent — see the matching
       comment in the hub's own index.html. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3d5af1" />
  <title>WARPZ</title>
  <!-- Same apple-touch-icon as every page — see the matching comment in
       the hub's own index.html. -->
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
  <!-- Same load order convention as every other game — see the matching
       comment in games/jewelz/index.html. -->
  <link rel="stylesheet" href="../../shared/tokens.css" />
  <link rel="stylesheet" href="../../shared/shell.css" />
  <link rel="stylesheet" href="../../shared/tools-panel.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Page-load spinner — see shared/tokens.css's .page-loading rules and
       shared/core/loading-indicator.js. Same convention on every page. -->
  <div class="page-loading" id="pageLoading" aria-hidden="true"><div class="page-loading__spinner"></div></div>

  <!-- Same .shell > .shell-stage#game-stage > #game-root convention as
       every other game, and same canvas-only approach as JEWELZ — nothing
       here is a DOM element the game draws with, it's all Canvas drawing
       commands in index.js/Asteroid.js. -->
  <div class="shell" id="app-shell">
    <div class="shell-stage" id="game-stage">
      <div id="game-root">
        <canvas id="responsiveCanvas" width="450" height="800"></canvas>
        <!-- Filled in by index.js with the current "Score: [star shard image] = N"
             text while a round is in progress. -->
        <div id="liveScore"></div>
      </div>
    </div>
  </div>

  <!-- Temporary dev-only debug label showing which obstacle type is
       currently selected vs. actually locked in for the running round —
       added to help track down a "picked Zapper, got Asteroids" report.
       Remove once that's resolved. -->
  <div id="obstacleDebugLabel" class="warpz-obstacle-debug"></div>

  <!-- Powers the confetti celebration on a new personal best (see
       shared/core/shell.js's fireConfetti()). defer (not a plain blocking
       script tag): without it, the browser pauses HTML parsing — and, more
       importantly, the FIRST PAINT of the whole page, spinner included —
       to fetch this from a cross-origin CDN before it can render anything,
       which on a slow/cellular connection is exactly what leaves WARPZ (the
       heaviest page on the site) looking blank instead of showing the
       page-load spinner. defer fetches it in the background and still runs
       it (in document order, before index.js) once parsing finishes — same
       effective timing, just non-render-blocking. See loading-indicator.js. -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script type="module" src="index.js"></script>
</body>
</html>

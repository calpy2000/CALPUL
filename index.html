<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Page-load spinner CSS, INLINE (not a <link>) and first thing in <head>
     — deliberately duplicated on every page rather than centralized in
     tokens.css, since a <link rel="stylesheet"> is render-blocking and
     this needs to paint BEFORE any network request finishes, including
     tokens.css's own. Colors are hardcoded (not var(--accent) etc.)
     because tokens.css, which defines those custom properties, hasn't
     necessarily loaded yet at this point either. Paired with the
     #pageLoading div (first thing in <body>, below) and
     hidePageLoadingIndicator() (shared/core/loading-indicator.js, called
     as the first statement in this page's own index.js — see that file's
     own comment for why that moment is the right one). -->
<style>
  .page-loading{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#eef0f3;opacity:0;pointer-events:none;animation:page-loading-reveal 0s 200ms forwards}
  @keyframes page-loading-reveal{to{opacity:1;pointer-events:auto}}
  .page-loading__spinner{width:68px;height:68px;border-radius:50%;border:6px solid #c7cdd6;border-top-color:#3d5af1;animation:page-loading-spin .8s linear infinite}
  @keyframes page-loading-spin{to{transform:rotate(360deg)}}
</style>
<!-- width=device-width makes the page's CSS-pixel width match the actual
     device screen (rather than a zoomed-out "desktop-site" view); the scale
     values keep users from pinch-zooming the page, since this is meant to
     feel like a small self-contained app rather than a document. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Launches from the home-screen icon with NO Safari chrome at all (no
     back button, no share/reload/tabs pill) — without these, iOS just
     opens the site as a normal Safari tab even from the home screen. Only
     takes effect for icons added AFTER this ships; anyone who already
     added PUSULZ to their home screen needs to remove and re-add it to
     pick this up, since iOS bakes the launch mode into the icon at the
     moment it's created. mobile-web-app-capable is the newer non-prefixed
     name (Android/other browsers); apple-mobile-web-app-capable is what
     iOS Safari itself actually reads — both included since iOS support
     for the non-prefixed one is inconsistent across versions. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- The Android/Samsung Internet/Chrome equivalent of the above — a Web
     App Manifest is what those browsers actually check for standalone
     "Add to Home Screen" behavior (the meta tags above are largely
     iOS-only). theme-color additionally tints the browser's own UI even
     for someone who hasn't installed it at all. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d5af1">
<title>PUSULZ</title>
<!-- iOS Safari's "Add to Home Screen" ignores plain favicons and falls
     back to a blurry auto-grabbed one without this — same "P" tile design
     as favicon.ico, just rendered crisp at the size iOS actually wants
     (180x180, flat/unrounded — iOS applies its own rounded-square mask on
     top of whatever's supplied here). -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- tokens.css must load first — it defines the CSS custom properties
     (--ink, --accent, --space-md, etc.) that both tools-panel.css and this
     page's own style.css rely on via var(--name). -->
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/tools-panel.css">
<link rel="stylesheet" href="shared/beta-gate.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Page-load spinner (shared/core/loading-indicator.js + tokens.css's
       own .page-loading rules) — first thing in the DOM on every page, so
       it paints as early as possible. Only actually becomes visible if
       still present 200ms later (a pure-CSS delay, see tokens.css) and is
       removed by index.js the moment this page's own JS module graph has
       finished loading. -->
  <div class="page-loading" id="pageLoading" aria-hidden="true"><div class="page-loading__spinner"></div></div>

  <!-- Beta-only entry gate (shared/core/beta-gate.js) — empty until index.js
       decides whether to fill it in, based on whether this device already
       has a saved tester code. Sits before .hub in the DOM so its
       position:fixed overlay (z-index:300, see shared/beta-gate.css) covers
       it completely while it's up. -->
  <div class="beta-gate is-hidden" id="beta-gate"></div>

  <div class="hub is-gate-hidden" id="hub">
    <!-- Each letter of PUSULZ is its own colored tile (colors borrowed from
         the 6 non-RAINZ game accents in games-registry.js, so the logo reads
         as "family" with the tiles below it). P and S are mirror-flipped
         (.is-mirrored — right-side up but reading backwards); Z is rotated
         (.is-upside-down — reads backwards AND upside down) — per the
         brand's deliberately jumbled-puzzle look. Each letter's outer -wrap
         span carries a fixed, hand-picked --tilt (15-30deg, alternating
         sign) baked directly into the HTML rather than set by JS at
         runtime — a plain static value in the very first rendered frame is
         what guarantees the tilt is visible BEFORE the inner tile's on-load
         spin animation starts, with zero dependency on script timing. -->
    <h1 class="hub__title">
      <span class="hub__title-tile-wrap" style="--tilt: -22deg"><span class="hub__title-tile is-mirrored" style="background:#E59A63">P</span></span>
      <span class="hub__title-tile-wrap" style="--tilt: 18deg"><span class="hub__title-tile" style="background:#6F9BDB">U</span></span>
      <span class="hub__title-tile-wrap" style="--tilt: -27deg"><span class="hub__title-tile is-mirrored" style="background:#63B98A">S</span></span>
      <span class="hub__title-tile-wrap" style="--tilt: 16deg"><span class="hub__title-tile" style="background:#AD82D6">U</span></span>
      <span class="hub__title-tile-wrap" style="--tilt: 24deg"><span class="hub__title-tile" style="background:#DFAE55">L</span></span>
      <span class="hub__title-tile-wrap" style="--tilt: -19deg"><span class="hub__title-tile is-upside-down" style="background:#DD7FA3">Z</span></span>
    </h1>
    <!-- Beta-testing badge — purple pill pinned to the top-right corner of
         the page (see .hub__beta-pill in style.css), independent of the
         title's own centered/animated layout so it can't disturb the
         swivel-in tiles above. -->
    <span class="hub__beta-pill">Beta</span>
    <!-- Left empty on purpose — index.js fills this in with one tile per
         game, built from games-registry.js, once the page loads. -->
    <div class="hub__grid" id="hub-grid"></div>
  </div>

  <!-- type="module" is what lets index.js use `import`/`export` statements
       (the ES module system — see the long comment at the top of index.js
       and shared/core/date-utils.js for more on why that matters). Module
       scripts are also automatically deferred: the browser waits until the
       whole page (including the #hub-grid div above) has been parsed before
       running this, so index.js never needs to worry about running before
       the elements it looks up (like #hub-grid) actually exist. -->
  <script type="module" src="index.js"></script>
</body>
</html>
